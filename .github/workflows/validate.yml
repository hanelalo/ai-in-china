name: validate

on:
  pull_request:
    paths:
      - 'src/data/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验项目数据
        run: node scripts/validate.mjs
